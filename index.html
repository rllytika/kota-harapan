<style>

.op{display:block;width:100%;text-align:left;margin:6px 0}.p{position:relative}.xx{position:absolute;top:8px;right:8px;padding:2px 10px;background:#f4a0a0;line-height:1.3}.b:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.mn{text-align:center;background:linear-gradient(#fff4e0ee,#ffd9e6ee);width:min(640px,94vw)}.ttl{font:900 clamp(40px,9vw,70px)/.95 'Trebuchet MS',sans-serif;color:#ffd23a;text-shadow:3px 3px 0 #9a6b4b,-2px -2px 0 #9a6b4b,2px -2px 0 #9a6b4b,-2px 2px 0 #9a6b4b;animation:bob 2s ease-in-out infinite;margin:4px 0 10px}.rib{display:inline-block;background:#f7b2c4;border:3px solid var(--br);border-radius:10px;padding:3px 14px;font-weight:700;margin-bottom:10px}.hr{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap}.hr canvas{animation:bob 1.6s ease-in-out infinite}.mb{display:flex;flex-direction:column;gap:8px}.big{min-width:190px;font-size:16px;padding:10px 16px}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes pls{50%{transform:scale(1.06)}}
.mn{background:none;border:0;overflow:visible;width:min(780px,96vw)}.mn .ttl{font-size:clamp(54px,13vw,112px);letter-spacing:2px;text-shadow:4px 4px 0 #8a4f2a,-3px -3px 0 #8a4f2a,3px -3px 0 #8a4f2a,-3px 3px 0 #8a4f2a,0 9px 0 #6a3a1c,0 0 24px #fff8}.mn .rib{background:linear-gradient(#ff9fc0,#f27ca8);color:#fff;text-shadow:0 2px 0 #8a3a5a;font-size:clamp(13px,3.2vw,19px);padding:5px 22px;border-radius:6px;box-shadow:0 4px 0 #7a4524}.spk{color:#fff;font-size:22px;letter-spacing:12px;animation:bob 2.4s ease-in-out infinite;text-shadow:0 0 10px #ffe27a}.mn .big{min-width:250px;font-size:18px;border-radius:16px;color:#fff;text-shadow:0 2px 0 #0005;box-shadow:0 5px 0 #7a4524;padding:11px 18px}.mn .g{background:#5fc96a}.mn .bl{background:#5aa9ec}.mn .pk{background:#f27ca8}.mn .or{background:#f6a23a}.pulse{animation:pls 1.5s ease-in-out infinite}.ft{margin-top:14px;color:#fff;text-shadow:0 2px 0 #4a3426;font-weight:700;font-size:13px}

.touch #mm{width:120px;height:84px}.touch #bt{bottom:auto;top:106px;right:8px;flex-direction:column;gap:4px}.touch #bt .b{padding:5px 8px;font-size:12px}.touch #ms{max-width:52vw;font-size:11px;top:70px}
@media(max-width:600px){.hr{display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:6px}#m0{grid-column:1;grid-row:1}#m1{grid-column:2;grid-row:1}.hr canvas{width:92px;height:auto}.mb{grid-column:1/3;grid-row:2;width:100%;align-items:center}.mn .big{min-width:min(280px,80vw)}.ft{font-size:11px}#ms{max-width:52vw;font-size:11px}}
@media(max-height:520px){.mn{overflow:auto}.mn .ttl{font-size:44px}.mn .ttl br{display:none}.spk{display:none}.hr canvas{height:90px;width:auto}.mn .big{padding:6px 12px;font-size:15px}.ft{display:none}.mb{gap:6px}}.ok{background:#a6e6a0!important}.no{background:#f4a0a0!important}

.ch{display:inline-block;padding:1px 6px;margin:2px;border-radius:8px;background:#e8d8c0;font-size:11px}.ch.d{background:#a6e6a0}
.tx{white-space:normal;background:#fffdf7;padding:10px;max-height:50vh;overflow:auto;min-height:120px}.tx>div{margin:7px 0;padding:8px 11px;border-radius:12px;line-height:1.55;background:#fff;opacity:0;animation:fin .5s forwards}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tx b.k{background:linear-gradient(transparent 55%,#ffe27a 55%);font-weight:700}.lb{display:flex;gap:10px;align-items:flex-start;border-left:6px solid}.lb .ic{font-size:24px}.lb b.t{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.7}
.def{background:#e8f2ff!important;border-left-color:#5aa9ec}.cir{background:#fff0f5!important;border-left-color:#f27ca8}.pen{background:#fff6dd!important;border-left-color:#f6a23a}.con{background:#e9f9e6!important;border-left-color:#5fc96a}.kas{background:#f1e8ff!important;border-left-color:#9a6ad8}
.nm2{display:flex;gap:10px;align-items:flex-start;border:2px solid #e8d8c0}.bd{flex:none;width:28px;height:28px;border-radius:50%;background:#f27ca8;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.nm2 .ti{color:#b0602a}.ex{margin-top:6px;background:#e9f9e6;border-radius:8px;padding:5px 8px;font-size:.95em}.bub{background:#fff7d6!important;border:2px solid #f0d070;border-radius:16px!important}.bub .who{font-weight:800;color:#b0602a}

<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
let S=Object.assign({hero:0,seen:[],done:[],xp:0,sc:{},mus:1,sfx:1,fin:0,fs:0,st:0});try{Object.assign(S,JSON.parse(localStorage.getItem('kh')))}catch(e){}
const sv=()=>{try{localStorage.setItem('kh',JSON.stringify(S))}catch(e){}};
/* AUDIO */
let AC,mi=0,mt;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d,t,v){try{const a=ac(),o=a.createOscillator(),n=a.createGain();o.type=t||'square';o.frequency.value=f;n.gain.value=v||.05;o.connect(n);n.connect(a.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
const beep=(f,d)=>S.sfx&&tone(f,d||.1);
const ML=[523,659,784,659,587,698,880,698,523,659,784,1047,988,784,659,587];
function music(){clearInterval(mt);if(S.mus)mt=setInterval(()=>tone(ML[mi++%16],.22,'triangle',.03),280)}
/* DATA */
const HR=[{n:'Raka',hair:'#4a2c1c',shirt:'#fff',tie:'#d83a3a',pants:'#2a3350',bag:'#7a4a2a'},{n:'Rina',hair:'#5a3424',long:1,clip:1,shirt:'#fff',bow:'#f48fb1',pants:'#3a3040',skirt:1,bag:'#c97b8f'}];
const CH=[{t:'Pengertian Pengangguran',n:['budi']},{t:'Penyebab Pengangguran',n:['rahmat']},{t:'Jenis-Jenis Pengangguran',n:['sinta','andi','budit','dika','joko','ani']},{t:'Dampak Pengangguran',n:['sari']},{t:'Solusi Pengangguran',n:['dina']}];
const N=[
{id:'budi',name:'Pak Budi',role:'Petugas Ketenagakerjaan',x:800,y:205,ch:0,l:{hair:'#3a2a20',shirt:'#2a3a6a',tie:'#c33',pants:'#222',gl:1},pages:[
['Sapaan','Halo, selamat datang di Kota Harapan! Saya Pak Budi dari Kantor Pekerjaan. Banyak warga kami sedang kesulitan mencari nafkah. Supaya kamu paham masalahnya, kita mulai dari dasar: apa itu pengangguran?'],
['Pengertian Pengangguran','Pengangguran adalah penduduk usia kerja yang tidak bekerja, mau dan mampu bekerja, serta sedang aktif mencari pekerjaan.\n\nOrang yang tidak bekerja karena memang tidak mau bekerja atau tidak mencari kerja tidak dihitung sebagai pengangguran.'],
['Angkatan Kerja','Penduduk usia kerja (15 tahun ke atas) terbagi dua.\n\nAngkatan kerja: mereka yang bekerja ditambah yang sedang mencari kerja (pengangguran).\nBukan angkatan kerja: mereka yang tidak bekerja dan tidak mencari kerja, misalnya pelajar, mahasiswa aktif, ibu rumah tangga, dan pensiunan.\n\nPerbedaan utamanya: angkatan kerja aktif di pasar kerja, sedangkan bukan angkatan kerja tidak.'],
['Contoh Kasus','Kasus: seorang lulusan perguruan tinggi sudah wisuda, rajin mengirim lamaran, tetapi belum diterima bekerja.\n\nIa termasuk pengangguran karena (1) berusia kerja dan masuk angkatan kerja, (2) mau dan mampu bekerja, (3) aktif mencari kerja, (4) belum mendapat pekerjaan.\n\nContoh lain: korban PHK yang melamar ke banyak perusahaan, atau lulusan SMK yang menunggu panggilan kerja. Mahasiswa yang masih kuliah bukan pengangguran.']]},
{id:'rahmat',name:'Pak Rahmat',role:'Pekerja Senior',x:1300,y:262,ch:1,l:{hair:'#aaa',shirt:'#8b6b3a',pants:'#444'},pages:[
['Cerita Pak Rahmat','Dulu saya bekerja 25 tahun di pabrik ini. Lalu mesin baru datang dan pabrik hanya butuh operator yang bisa komputer. Saya kehilangan pekerjaan. Dari pengalaman itu saya belajar banyak tentang penyebab pengangguran. Dengarkan ya.'],
['Penyebab 1-4','1. Pertumbuhan penduduk dan angkatan kerja: pencari kerja bertambah tiap tahun, misalnya ribuan lulusan baru.\n2. Terbatasnya lapangan kerja: lowongan lebih sedikit daripada pelamar, sehingga ratusan orang berebut satu posisi.\n3. Rendahnya pendidikan: lulusan SD sulit memenuhi syarat kerja di pabrik modern.\n4. Kurangnya keterampilan: pekerja tidak menguasai keahlian yang dicari, misalnya mengoperasikan mesin atau komputer.'],
['Penyebab 5-8','5. Teknologi dan otomatisasi: robot perakit menggantikan puluhan buruh.\n6. Ketidaksesuaian keterampilan dengan kebutuhan industri: lulusan menguasai hal lama, padahal industri butuh keahlian digital.\n7. Penurunan kegiatan ekonomi: saat krisis, penjualan turun dan perusahaan mengurangi karyawan.\n8. Perubahan struktur perekonomian: kota bergeser dari pertanian ke industri dan jasa, sehingga pekerja lama harus beradaptasi.']]},
{id:'sinta',name:'Sinta',role:'Pengangguran Friksional',x:300,y:205,ch:2,l:{hat:'grad',hair:'#5a3a2a',shirt:'#222',pants:'#222'},pages:[['Pengangguran Friksional','Sinta: “Aku baru lulus dan sedang memilih pekerjaan yang cocok.”\n\nDefinisi: pengangguran karena masa peralihan pekerjaan atau sedang mencari pekerjaan yang lebih sesuai.\nCiri-ciri: bersifat sementara, memiliki keterampilan, selektif memilih pekerjaan.\nPenyebab: lulusan baru, pindah kerja, informasi lowongan kurang.\nContoh: karyawan yang resign dan sedang mencari pekerjaan baru.']]},
{id:'andi',name:'Andi',role:'Pengangguran Struktural',x:1150,y:225,ch:2,l:{hat:'hard',hair:'#3a2a20',shirt:'#f08a2a',pants:'#3a4a7a'},pages:[['Pengangguran Struktural','Andi: “Pabrikku berubah, keahlianku tidak terpakai lagi.”\n\nDefinisi: pengangguran akibat perubahan struktur ekonomi sehingga keterampilan tidak sesuai kebutuhan pasar kerja.\nCiri-ciri: berlangsung lama, butuh pelatihan baru, terjadi saat industri berubah.\nPenyebab: pergeseran sektor ekonomi, keahlian usang.\nContoh: pekerja pabrik kehilangan pekerjaan karena industri butuh keterampilan baru.']]},
{id:'budit',name:'Budi',role:'Pengangguran Teknologi',x:1000,y:505,ch:2,l:{hair:'#2a2030',gl:1,shirt:'#8a9ab0',pants:'#2a3350'},pages:[['Pengangguran Teknologi','Budi: “Pekerjaanku diambil alih mesin dan teknologi.”\n\nDefinisi: pengangguran karena tenaga manusia digantikan mesin, teknologi, atau otomatisasi.\nCiri-ciri: pekerjaan rutin diganti mesin, perusahaan lebih efisien, pekerja harus belajar keahlian digital.\nPenyebab: otomatisasi dan digitalisasi.\nContoh: kasir tertentu digantikan sistem pembayaran otomatis.']]},
{id:'dika',name:'Dika',role:'Pengangguran Siklis',x:1350,y:500,ch:2,l:{hair:'#2a2030',shirt:'#e8e0d0',pants:'#2f4a7a',ac:'#2f4a7a'},pages:[['Pengangguran Siklis','Dika: “Penjualan perusahaan anjlok, aku dan banyak temanku di-PHK.”\n\nDefinisi: pengangguran akibat penurunan kegiatan ekonomi atau resesi sehingga perusahaan mengurangi produksi dan tenaga kerja.\nCiri-ciri: terjadi massal, mengikuti siklus naik-turun ekonomi, membaik saat ekonomi pulih.\nPenyebab: resesi, daya beli turun.\nContoh: perusahaan mengurangi karyawan karena penjualan menurun.']]},
{id:'joko',name:'Joko',role:'Pengangguran Musiman',x:300,y:505,ch:2,l:{hat:'straw',hair:'#3a2a20',shirt:'#5a7a3a',pants:'#5a7a3a'},pages:[['Pengangguran Musiman','Joko: “Setelah panen selesai, tidak ada kerjaan di sawah.”\n\nDefinisi: pengangguran karena pekerjaan hanya tersedia pada musim atau waktu tertentu.\nCiri-ciri: berulang setiap tahun, bergantung musim, hanya sementara.\nPenyebab: pola musim pertanian atau pariwisata.\nContoh: petani yang menganggur setelah musim panen berakhir.']]},
{id:'ani',name:'Ani',role:'Pengangguran Terselubung',x:545,y:815,ch:2,l:{hat:'hijab',hair:'#9a8ad0',shirt:'#7a7ab8',pants:'#5a5a98',skirt:1},pages:[['Pengangguran Terselubung','Ani: “Kami bekerja berdelapan di ladang kecil ini, padahal berempat cukup.”\n\nDefinisi: kondisi ketika tenaga kerja melebihi kebutuhan sehingga sebagian pekerja tidak menambah hasil produksi berarti.\nCiri-ciri: tampak bekerja tetapi produktivitas rendah, jam kerja longgar, mengurangi pekerja tidak menurunkan hasil.\nPenyebab: lahan/usaha terbatas, kurangnya lapangan kerja lain.\nContoh: usaha pertanian dengan terlalu banyak pekerja.']]},
{id:'sari',name:'Bu Sari',role:'Pemilik UMKM',x:1150,y:500,ch:3,l:{hair:'#8b4a2b',long:1,shirt:'#e8a0b8',pants:'#6a4a5a',skirt:1},pages:[
['Dampak: Individu dan Keluarga','Bu Sari: “Tokoku sepi sejak banyak warga kehilangan kerja.”\n\nBagi individu dan keluarga: pendapatan hilang, kebutuhan hidup (makan, sekolah, kesehatan) sulit dipenuhi, dan kesejahteraan keluarga menurun. Contoh: keluarga yang kepala keluarganya di-PHK harus berhutang dan menarik anak dari sekolah.'],
['Dampak: Masyarakat','Saat pengangguran naik: kemiskinan meningkat; kesenjangan sosial melebar antara yang bekerja dan tidak; muncul masalah sosial seperti pencurian dan tindak kriminal; daya beli turun sehingga pedagang seperti saya kehilangan pembeli dan omzet menurun, lalu ikut mengurangi pekerja.'],
['Dampak: Perekonomian Negara','Bagi negara: produktivitas menurun karena tenaga kerja tidak terpakai; penerimaan pajak berkurang; beban pemerintah bertambah (bantuan sosial, jaminan); dan pertumbuhan ekonomi melambat. Ini bisa menjadi lingkaran: pengangguran menurunkan ekonomi, ekonomi lesu menambah pengangguran.']]},
{id:'dina',name:'Dina',role:'Mahasiswi',x:440,y:205,ch:4,l:{hair:'#2a2030',long:1,gl:1,shirt:'#f4b0c8',pants:'#3a3a5a',skirt:1},pages:[
['Pertemuan di Pusat Pelatihan','Dina: “Halo! Aku Dina, mahasiswi yang menjadi relawan di Pusat Pelatihan Kerja ini. Kamu pasti sudah bertemu banyak warga yang kesulitan mencari kerja ya?”\nKamu mengangguk. Di halaman pusat pelatihan, puluhan warga tampak sibuk belajar: ada yang berlatih mengetik, ada yang memperbaiki mesin, ada pula yang belajar membuat kue untuk dijual.'],['Kisah Kak Rizal','Dina: “Dulu kakakku, Rizal, di-PHK saat perusahaannya sepi pesanan. Berbulan-bulan ia menganggur dan hampir putus asa.”\nSuatu hari Rizal mendengar info pelatihan dari bursa kerja. Ia belajar keahlian baru selama dua bulan, lalu diterima di pabrik yang sedang berkembang. Kini ia bahkan membuka usaha kecil dan mempekerjakan dua tetangga.\nDina: “Dari sini aku sadar: pengangguran bisa diatasi, asal solusinya tepat. Yuk, kita pelajari!”'],['Pak Budi Datang','Pak Budi: “Dina, tolong ajak tamu kita berkeliling. Pemerintah kota sedang menyiapkan program untuk semua jenis pengangguran.”\nDina: “Siap, Pak! Pertama, mari kita lihat daftar solusinya satu per satu.”'],['Solusi 1-3','1. Meningkatkan kualitas pendidikan: mengatasi pendidikan rendah dan ketidaksesuaian keahlian. Contoh: beasiswa dan kurikulum sesuai industri.\n2. Pelatihan keterampilan kerja: mengatasi pengangguran struktural dan teknologi. Contoh: pelatihan operator mesin digital di Pusat Pelatihan.\n3. Memperluas lapangan pekerjaan: mengatasi terbatasnya lowongan. Contoh: proyek padat karya dan kawasan industri baru.'],
['Solusi 4-6','4. Kewirausahaan dan UMKM: menciptakan kerja sendiri dan menyerap tenaga kerja, cocok untuk friksional dan musiman. Contoh: usaha kuliner seperti milik Bu Sari.\n5. Meningkatkan investasi: pabrik dan usaha baru membuka lowongan.\n6. Subsidi upah: membantu perusahaan mempertahankan karyawan saat ekonomi lesu, mengatasi pengangguran siklis.'],
['Solusi 7-9','7. Kebijakan fiskal: pemerintah menambah belanja (infrastruktur) atau menurunkan pajak agar kegiatan ekonomi bergerak, mengatasi pengangguran siklis.\n8. Kebijakan moneter: menurunkan suku bunga dan memperlancar kredit agar investasi dan UMKM tumbuh.\n9. Informasi dan layanan penempatan kerja: bursa kerja dan portal lowongan menghubungkan pencari kerja dengan perusahaan, mengatasi pengangguran friksional.\n\nSetiap jenis pengangguran butuh solusi yang tepat!']]},
